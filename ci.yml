name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Syntax Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all modules
        run: |
          python -m py_compile mock_agent.py
          python -m py_compile analyst_agent.py
          python -m py_compile legends_agent.py
          python -m py_compile sentiment_agent.py
          python -m py_compile state_manager.py
          python -m py_compile alpaca_trader.py
          python -m py_compile scheduler.py
          python -m py_compile sheets_pusher.py
          python -m py_compile telegram_bot.py
          python -m py_compile scanner.py
          python -m py_compile true_backtest.py
          echo "✅ All modules pass syntax check"

      - name: Secret scan — ensure no credentials committed
        run: |
          if [ -f "gcp_key.json" ]; then
            echo "❌ SECURITY: gcp_key.json must not be committed!" && exit 1
          fi
          if [ -f ".env" ]; then
            echo "❌ SECURITY: .env must not be committed!" && exit 1
          fi
          echo "✅ No secrets found in repository"

      - name: JSON contract validation (mock pipeline)
        run: |
          python mock_agent.py
          python legends_agent.py
          python -c "
          import json
          r = json.load(open('rapor.json'))
          assert r.get('varlıklar'), 'rapor.json: no assets'
          assert 'ATR_14' in r['varlıklar'][0]['veri'], 'rapor.json: ATR_14 missing'
          assert 'SMA_200' in r['varlıklar'][0]['veri'], 'rapor.json: SMA_200 missing'
          assert 'ana_trend' in r['varlıklar'][0]['veri'], 'rapor.json: ana_trend missing'
          print('✅ rapor.json contract valid')
          lr = json.load(open('legends_rapor.json'))
          assert lr.get('sonuclar'), 'legends_rapor.json: no results'
          assert 'atr' in lr['sonuclar'][0], 'legends_rapor.json: atr missing'
          print('✅ legends_rapor.json contract valid')
          print('✅ All JSON contracts valid')
          "
