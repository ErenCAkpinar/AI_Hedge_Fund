name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Syntax Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all modules
        run: |
          python -m py_compile mock_agent.py
          python -m py_compile analyst_agent.py
          python -m py_compile legends_agent.py
          python -m py_compile sentiment_agent.py
          python -m py_compile state_manager.py
          python -m py_compile alpaca_trader.py
          python -m py_compile scheduler.py
          python -m py_compile sheets_pusher.py
          python -m py_compile telegram_bot.py
          python -m py_compile scanner.py
          python -m py_compile true_backtest.py
          echo "✅ All modules pass syntax check"

      - name: Secret scan — ensure no credentials committed
        run: |
          if [ -f "gcp_key.json" ]; then
            echo "❌ SECURITY: gcp_key.json must not be committed!" && exit 1
          fi
          if [ -f ".env" ]; then
            echo "❌ SECURITY: .env must not be committed!" && exit 1
          fi
          echo "✅ No secrets found in repository"

      - name: JSON contract validation — schema check on example files
        run: |
          python -c "
          import json, sys

          # --- rapor.example.json contract ---
          try:
              r = json.load(open('examples/rapor.example.json'))
          except FileNotFoundError:
              print('❌ examples/rapor.example.json not found'); sys.exit(1)

          assert r.get('varlıklar'), 'rapor.example.json: no assets list'
          asset = r['varlıklar'][0]
          assert 'veri' in asset, 'rapor.example.json: missing veri block'
          assert 'ATR_14' in asset['veri'], 'rapor.example.json: ATR_14 missing from veri'
          assert 'SMA_200' in asset['veri'], 'rapor.example.json: SMA_200 missing from veri'
          assert 'ana_trend' in asset['veri'], 'rapor.example.json: ana_trend missing from veri'
          print('✅ rapor.example.json contract valid')

          # --- final_karar.example.json contract ---
          try:
              f = json.load(open('examples/final_karar.example.json'))
          except FileNotFoundError:
              print('❌ examples/final_karar.example.json not found'); sys.exit(1)

          assert f.get('kararlar'), 'final_karar.example.json: no kararlar list'
          karar = f['kararlar'][0]
          assert 'atr_degeri' in karar, 'final_karar.example.json: atr_degeri missing'
          assert 'atr_kullanildi' in karar, 'final_karar.example.json: atr_kullanildi missing'
          assert 'sl_tipi' in karar, 'final_karar.example.json: sl_tipi missing'
          assert 'poz_buyukluk' in karar, 'final_karar.example.json: poz_buyukluk missing'
          assert 'stop_loss' in karar, 'final_karar.example.json: stop_loss missing'
          assert 'take_profit' in karar, 'final_karar.example.json: take_profit missing'
          print('✅ final_karar.example.json contract valid')

          print('✅ All JSON contracts valid')
          "

      - name: Generated file leak check
        run: |
          LEAKED=0
          for f in rapor.json legends_rapor.json sentiment_rapor.json final_karar.json order_log.json true_backtest_rapor.json; do
            if [ -f "$f" ]; then
              echo "❌ Generated file should not be committed: $f"
              LEAKED=1
            fi
          done
          for f in *.log; do
            if [ -f "$f" ]; then
              echo "❌ Log file should not be committed: $f"
              LEAKED=1
            fi
          done
          if [ $LEAKED -eq 1 ]; then exit 1; fi
          echo "✅ No generated files or logs found in repo"
