name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: Syntax Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile mock_agent.py analyst_agent.py legends_agent.py \
            sentiment_agent.py state_manager.py alpaca_trader.py scheduler.py \
            sheets_pusher.py telegram_bot.py scanner.py true_backtest.py \
            rpa_screen.py rpa_stats.py
          echo "✅ Syntax OK"

      - name: Import check (py_compile cannot catch a missing dependency)
        run: |
          python - << 'PYEOF'
          import rpa_screen, rpa_stats

          # A missing statsmodels would degrade condition 3 to a single
          # implementation silently, so fail here rather than in a report.
          probe = [0.01, -0.02, 0.03, 0.00, -0.01] * 40
          library = rpa_stats.statsmodels_hac_se(probe)
          assert library is not None, "statsmodels missing: HAC cross-check would degrade"
          hand = rpa_stats.bartlett_hac_se(probe)
          assert abs(hand - library) / library < 1e-10, "HAC paths disagree"
          print("✅ Imports OK, HAC cross-check live")
          PYEOF

      - name: Secret scan
        run: |
          [ -f gcp_key.json ] && echo "❌ gcp_key.json committed!" && exit 1
          [ -f .env ]         && echo "❌ .env committed!"         && exit 1
          echo "✅ No secrets"

      - name: JSON schema contract (static fixtures only — no network)
        run: |
          python - << 'PYEOF'
          import json, sys

          r = json.load(open("examples/rapor.example.json"))
          assert r.get("varlıklar"),                         "rapor: no assets"
          v = r["varlıklar"][0]["veri"]
          assert "ATR_14"    in v,                           "rapor: ATR_14 missing"
          assert "SMA_200"   in v,                           "rapor: SMA_200 missing"
          assert "ana_trend" in v,                           "rapor: ana_trend missing"
          print("✅ rapor.example.json OK")

          f = json.load(open("examples/final_karar.example.json"))
          assert f.get("kararlar"),                          "final_karar: no kararlar"
          k = f["kararlar"][0]
          assert "atr_degeri"     in k,                     "final_karar: atr_degeri missing"
          assert "atr_kullanildi" in k,                     "final_karar: atr_kullanildi missing"
          assert "sl_tipi"        in k,                     "final_karar: sl_tipi missing"
          assert "poz_buyukluk"   in k,                     "final_karar: poz_buyukluk missing"
          assert "stop_loss"      in k,                     "final_karar: stop_loss missing"
          assert "take_profit"    in k,                     "final_karar: take_profit missing"
          print("✅ final_karar.example.json OK")

          print("✅ All JSON contracts valid")
          PYEOF

      - name: Generated file leak check
        run: |
          FAIL=0
          for f in rapor.json legends_rapor.json sentiment_rapor.json \
                   final_karar.json order_log.json true_backtest_rapor.json; do
            [ -f "$f" ] && echo "❌ Committed generated file: $f" && FAIL=1
          done
          for f in *.log; do
            [ -f "$f" ] && echo "❌ Committed log file: $f" && FAIL=1
          done
          [ $FAIL -eq 1 ] && exit 1
          echo "✅ No generated files or logs"
